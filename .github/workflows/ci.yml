name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor. sanitize-html pulls in an ESM-only
          # parser, which needs require(ESM) — added in Node 20.19.
          node-version: 22
          cache: npm

      - run: npm ci

      # shared-types must be built before anything can compile against it.
      - run: npm run build:types

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # The e2e suite downloads a mongod binary, so it is cached separately
      # and run last — it is the slowest step and the least likely to fail.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm run test:e2e --workspace @isd/api

      - run: npm run build
