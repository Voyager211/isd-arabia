# Render blueprint for the API (PROJECT_PLAN.md §14.4).
#
# The free tier sleeps after 15 minutes of inactivity with a 30–50s cold start,
# so point UptimeRobot at /api/v1/health every 5 minutes. Note that the 750
# instance-hours per month cover exactly ONE always-on service — a staging API
# on the same account has to be allowed to sleep.
#
# ── Before deploying ────────────────────────────────────────────────────────
#
#   1. Atlas → Network Access must allow 0.0.0.0/0. Render's free tier has no
#      static outbound IP, so there is no narrower rule that will work. The
#      database is still protected by its credentials.
#
#   2. The API validates every variable at boot and refuses to start if any is
#      missing or malformed, so a bad value fails the deploy loudly rather than
#      at the first request.
#
services:
  - type: web
    name: isd-arabia-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health

    # shared-types is built first; the API compiles against its dist output.
    buildCommand: npm ci && npm run build:types && npm run build --workspace @isd/api
    startCommand: node apps/api/dist/main.js

    envVars:
      # ── Fixed ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: NODE_VERSION
        # sanitize-html depends on an ESM-only parser, which needs require(ESM).
        value: '22'

      # ── Generated by Render, never seen by anyone ────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── Sensible defaults; override only with a reason ───────────────────
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: isd-arabia

      # ── Required: database ───────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false

      # ── Required: the super admin the seed script creates ────────────────
      # Mandatory in production. The documented default credential
      # (superadmin@example.com / @Password123) is refused outright — it is
      # guessable by an automated scanner within minutes of going live.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # ── Required: Cloudinary ─────────────────────────────────────────────
      # The key must have the Master Admin role; a Media Library User key
      # authenticates but cannot upload. Verify with:
      #   npm run verify:cloudinary --workspace @isd/api
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Required: the CORS allowlist and the revalidation callback ───────
      # These are the deployed Vercel URLs. They are not known until the
      # frontends exist, so set placeholders now and correct them after the
      # first Vercel deploy — see the deployment order in README.md.
      # REVALIDATE_SECRET must match the storefront's value exactly, or cache
      # purging silently 401s and admin edits appear not to save.
      - key: STOREFRONT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: STOREFRONT_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false

      # ── Required: Cloudflare Turnstile ───────────────────────────────────
      # Free, and mandatory in production — the schema refuses to let
      # TURNSTILE_ENABLED be false there. Guards the quotation and catalogue
      # download forms alongside a honeypot and per-IP rate limits.
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # ── Optional: the internal quotation notification email ──────────────
      # Off by default so the API can deploy without an SMTP account. Turn it
      # on by setting this to true, at which point SMTP_HOST, SMTP_USER,
      # SMTP_PASSWORD, MAIL_FROM and QUOTATION_NOTIFY_TO all become required
      # and must be added here — the API will refuse to boot without them
      # rather than silently never sending.
      - key: QUOTATION_NOTIFY_ENABLED
        value: 'false'
